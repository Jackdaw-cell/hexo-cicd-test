# .github/workflows/cicd.yml
name: CICD
on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    name: Build and Deploy (self-hosted)
    runs-on: self-hosted # 关键：跑在你本机的自托管 runner 上
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # CI：安装依赖 + Prettier 规范检查
      - name: Install dependencies
        run: npm ci

      - name: Lint check (Prettier)
        run: npx prettier --check ./source

      # 构建：生成静态文件到 public/
      - name: Build site
        run: npm run build

      # CD：用 nginx 容器托管博客。每次部署都重建容器，等于更新到最新
      - name: Deploy to local nginx
        shell: bash
        run: |
          docker rm -f hexo-blog 2>/dev/null || true
          docker run -d --name hexo-blog -p 8080:80 nginx:alpine
          docker cp public/. hexo-blog:/usr/share/nginx/html
          echo "✅ 部署完成，访问 http://localhost:8080"
